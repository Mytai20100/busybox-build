name: Build BusyBox 

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Static BusyBox (${{ matrix.arch }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: x86_64
            cross_compile: ""
            cc: gcc
          - arch: aarch64
            cross_compile: aarch64-linux-gnu-
            cc: aarch64-linux-gnu-gcc
          - arch: armv7
            cross_compile: arm-linux-gnueabihf-
            cc: arm-linux-gnueabihf-gcc

    outputs:
      busybox_version: ${{ steps.get_version.outputs.busybox_version }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            wget tar

      - name: Get latest BusyBox version
        id: get_version
        run: |
          VERSION=$(wget -qO- https://busybox.net/downloads/ \
            | grep -oP 'busybox-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.bz2)' \
            | sort -V | tail -1)
          echo "busybox_version=$VERSION" >> $GITHUB_OUTPUT
          echo "BUSYBOX_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Latest BusyBox: $VERSION"

      - name: Download & extract source
        run: |
          wget -q https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2
          tar -xjf busybox-${BUSYBOX_VERSION}.tar.bz2

      - name: Configure (defconfig + static)
        working-directory: busybox-${{ env.BUSYBOX_VERSION }}
        run: |
          make defconfig
          echo "CONFIG_STATIC=y" >> .config
          echo "CONFIG_TC=n" >> .config
          echo "CONFIG_INETD=n" >> .config
          make oldconfig

      - name: Build
        working-directory: busybox-${{ env.BUSYBOX_VERSION }}
        run: |
          make -j$(nproc) \
            CROSS_COMPILE=${{ matrix.cross_compile }} \
            CC=${{ matrix.cc }} \
            busybox

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-static-${{ matrix.arch }}
          path: busybox-${{ env.BUSYBOX_VERSION }}/busybox

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Set version
        run: echo "BUSYBOX_VERSION=${{ needs.build.outputs.busybox_version }}" >> $GITHUB_ENV

      - name: Check if release already exists
        id: check_release
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/v${BUSYBOX_VERSION})
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        if: steps.check_release.outputs.status != '200'
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create tag & release
        if: steps.check_release.outputs.status != '200'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUSYBOX_VERSION }}
          name: "BusyBox Static v${{ env.BUSYBOX_VERSION }}"
          body: |
            Statically compiled BusyBox **v${{ env.BUSYBOX_VERSION }}** for multiple architectures.

            | File | Architecture |
            |------|-------------|
            | `busybox-static-x86_64` | x86_64 |
            | `busybox-static-aarch64` | ARM64 |
            | `busybox-static-armv7` | ARMv7 |
          files: artifacts/*
          generate_release_notes: false
